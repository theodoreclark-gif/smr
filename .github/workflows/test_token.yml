
name: Test SMR GitHub Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token authentication
        env:
          SMR_TOKEN: ${{ secrets.SMR_EDITOR_TOKEN }}
        run: |
          if [ -z "$SMR_TOKEN" ]; then
            echo "ERROR: SMR_EDITOR_TOKEN secret is missing."
            exit 1
          fi

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $SMR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/theodoreclark-gif/smr/contents/fleet_positions.json")

          echo "GitHub API HTTP status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "SUCCESS: Token authentication works."
          else
            echo "FAILED: GitHub returned HTTP $STATUS."
            exit 1
      
          fi
